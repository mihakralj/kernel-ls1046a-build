# versions.lock — pinned inputs for the producer build pipeline.
#
# Sourced by scripts/. Each variable uses `: "${VAR:=...}"` so an env-var
# override (e.g. `KERNEL_VERSION=6.6.140 ./scripts/run-pipeline.sh`) wins
# over the default. Edit + commit to change the persistent pin.
#
# As of the post-redistribution layout (May 2026), the producer is fully
# self-contained: no upstream/reference repos are fetched at build time.
# All inputs live in this repo:
#   - Kernel patches:     release/patches/{vyos,ask,fixes}/
#   - Vendored SDK drop:  release/patches/kernel/sdk-sources/
#   - OOT module sources: release/oot-modules/{cdx,fci,auto_bridge,iptables-extensions}/
#   - Userspace patches:  release/userspace-patches/{ppp,rp-pppoe}/

# ── Kernel ─────────────────────────────────────────────────────────────
# Pinned for deterministic builds. Empty → fetch-kernel.sh picks latest
# 6.6.y from kernel.org. Bump this in a dedicated commit + tag when you
# want to track a newer LTS point release.
: "${KERNEL_VERSION:=6.6.137}"

# ── NXP qoriq SDK reference (provenance for the in-tree SDK overlay) ───
# release/patches/kernel/sdk-sources/ is a verbatim mirror of the SDK
# driver dirs from this NXP qoriq commit. Kept here for provenance only;
# bump SHA + re-import to track a newer SDK (no fetcher script consumes
# this — re-imports are manual and infrequent).
: "${NXP_SDK_REPO:=https://github.com/nxp-qoriq/linux}"
: "${NXP_SDK_BRANCH:=ask-6.6-port}"
: "${NXP_SDK_SHA:=6d0b77e999047ccffa51a973f17f82b8d75d7e5e}"

export KERNEL_VERSION
export NXP_SDK_REPO NXP_SDK_BRANCH NXP_SDK_SHA