name: build-and-release

on:
  push:
    branches: [ "lts-6.6-ls1046a", "main", "mainline-6.18-port" ]
    tags: [ "kernel-*" ]
    paths:
      - "release/**"
      - "scripts/**"
      - ".github/workflows/build-and-release.yml"
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Linux 6.6.y version to build (blank → latest)"
        required: false
        default: ""
      publish:
        description: "Upload the resulting .debs to a GitHub Release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  # ── STEP 1: Power on the Azure ARM64 VM ──────────────────────────
  start-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Start VM
        run: |
          az vm start \
            --resource-group arm64-runner-group \
            --name arm64-runner

      - name: Wait for self-hosted runner
        env:
          GH_TOKEN: ${{ secrets.RUNNER_PAT || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUNNER_LABEL: self-hosted
        run: |
          probe=$(gh api "repos/${GH_REPO}/actions/runners" 2>&1 || true)
          if echo "$probe" | grep -q '"runners"'; then
            echo "Polling runner status..."
            deadline=$(( $(date +%s) + 300 ))
            while [ "$(date +%s)" -lt "$deadline" ]; do
              status=$(gh api "repos/${GH_REPO}/actions/runners" \
                --jq ".runners[] | select(.labels[].name==\"${RUNNER_LABEL}\") | .status" \
                | head -1 || true)
              if [ "$status" = "online" ]; then
                echo "Runner is online."
                exit 0
              fi
              sleep 5
            done
            exit 1
          else
            echo "API hidden, falling back to fixed wait..."
            sleep 45
          fi

  # ── STEP 2: The actual build ──────────────────────────────────────
  build:
    needs: start-vm
    name: Build ASK kernel (arm64, native)
    runs-on: self-hosted
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Ensure build deps present
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts quilt dpkg-dev \
            libssl-dev bc flex bison libelf-dev \
            fakeroot kmod rsync cpio patch patchutils \
            libmnl-dev libnftnl-dev libnetfilter-conntrack-dev libnfnetlink-dev \
            libpam0g-dev libpcap0.8-dev libsystemd-dev zlib1g-dev ppp-dev \
            libtraceevent-dev libdw-dev libunwind-dev libaudit-dev \
            libnuma-dev libperl-dev python3-dev libslang2-dev libzstd-dev \
            ccache

      - name: Preflight
        run: |
          echo "=== Host ===" && uname -a
          echo "=== GCC ===" && gcc --version | head -1
          echo "=== ccache ===" && ccache --version | head -1

      - name: Cache kernel source tarball
        id: kcache
        uses: actions/cache@v5
        with:
          path: work/linux-*.tar.xz
          key: kernel-${{ hashFiles('versions.lock') }}-${{ github.event.inputs.kernel_version || 'latest' }}

      - name: Cache ccache objects
        uses: actions/cache@v5
        with:
          path: work/.ccache
          key: ccache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-

      - name: Run pipeline (fetch → health → build)
        env:
          KERNEL_VERSION_INPUT: ${{ github.event.inputs.kernel_version }}
          CCACHE_DIR: ${{ github.workspace }}/work/.ccache
          CCACHE_MAXSIZE: 5G
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          TAG_KVER=""
          if [[ "${GITHUB_REF}" == refs/tags/kernel-* ]]; then
              TAG_KVER="${GITHUB_REF_NAME#kernel-}"
              TAG_KVER="${TAG_KVER%-ask*}"
          fi
          KVER="${KERNEL_VERSION_INPUT:-$TAG_KVER}"
          if [[ -n "$KVER" ]]; then
              ./scripts/run-pipeline.sh "$KVER" --build --ask-extras
          else
              ./scripts/run-pipeline.sh --build --ask-extras
          fi

      - name: Collect artefacts
        id: collect
        run: |
          set -euo pipefail
          KVER=$(ls work/build/linux-image-*.deb 2>/dev/null | head -1 \
                  | sed -E 's|.*linux-image-([0-9]+\.[0-9]+\.[0-9]+).*|\1|')
          echo "kver=$KVER" >> "$GITHUB_OUTPUT"

      - name: Upload build artefacts (workflow)
        uses: actions/upload-artifact@v7
        with:
          name: ask-kernel-${{ steps.collect.outputs.kver }}
          path: |
            work/build/*.deb
            work/build/*.changes
            work/build/*.buildinfo
            work/build/build.log
            release/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/kernel-') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          ARGS=()
          # When triggered by a tag push, ALWAYS pass that exact tag to the
          # publish script. publish-binaries.sh's auto-increment scanner
          # walks ask1, ask2, ask3, … and stops at the first NOT-listed
          # number — but past releases have been deleted (gaps in ask3..ask27),
          # so the auto-tag would silently land in a gap and overwrite a
          # historic release instead of creating ask37 from refs/tags/ask37.
          if [[ "${GITHUB_REF}" == refs/tags/kernel-* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            ARGS+=( --tag "$TAG" --force )
          fi
          ./scripts/publish-binaries.sh "${ARGS[@]}"

  # NOTE: VM deallocation is intentionally NOT a CI step. A systemd timer
  # on the VM (idle-deallocate.service / idle-deallocate.timer) self-
  # deallocates after 10 min of runner idleness. See
  # .clinerules/01-shared-vm-runtime.md for the full A+B pattern. Adding a
  # stop-vm step here would re-introduce the cross-workflow VM race that
  # killed builds in production on 2026-05-06.
