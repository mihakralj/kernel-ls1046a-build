name: build-and-release

# Triggers:
#   - push to the main branch → build + patch-health, NO release (safety net CI)
#   - workflow_dispatch        → manual build; optional release upload
#   - push tag kernel-*        → build the pinned version and upload as a Release
#
# The job cross-compiles arm64 on an x86_64 runner (ubuntu-latest) — this is
# what `make bindeb-pkg` with CROSS_COMPILE=aarch64-linux-gnu- does natively.

on:
  push:
    branches: [ "lts-6.6-ls1046a", "main" ]
    tags:     [ "kernel-*" ]
    paths:
      - "release/**"
      - "scripts/**"
      - ".github/workflows/build-and-release.yml"
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Linux 6.6.y version to build (blank → latest)"
        required: false
        default: ""
      publish:
        description: "Upload the resulting .debs to a GitHub Release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # needed for `gh release create` on tag pushes

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Cross-compile ASK kernel (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install toolchain and build deps
        run: |
          set -eux
          # ── Step 1: enable deb-src so `apt-get source` works ──────────
          # deb-src is commented out by default on ubuntu-latest. Needed
          # for build-ask-iptables.sh / build-ask-ppp.sh (`apt-get source`).
          if ls /etc/apt/sources.list.d/*.sources >/dev/null 2>&1; then
            # Ubuntu 24.04+ deb822 format.
            sudo sed -i 's/^Types: deb$/Types: deb deb-src/' \
              /etc/apt/sources.list.d/*.sources || true
          fi
          sudo sed -i 's/^# *deb-src /deb-src /' /etc/apt/sources.list || true

          # ── Step 2: install host + cross toolchain ───────────────────
          # Done before adding arm64 as a foreign arch so apt doesn't try
          # to fetch arm64 packages from archive.ubuntu.com (which doesn't
          # carry them — arm64 is on ports.ubuntu.com).
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            build-essential debhelper devscripts quilt \
            libssl-dev bc flex bison libelf-dev \
            fakeroot kmod dpkg-dev dpkg-cross rsync cpio patch \
            jq curl ca-certificates

          # ── Step 3: add arm64 foreign arch with correct URIs ─────────
          # ports.ubuntu.com is the canonical mirror for non-amd64/i386
          # Ubuntu architectures. Restrict existing sources to amd64 so
          # apt doesn't fail with 404s trying to pull arm64 Packages files
          # from the amd64 archive, then add arm64 sources pointing at
          # ports.ubuntu.com.
          sudo dpkg --add-architecture arm64

          if ls /etc/apt/sources.list.d/ubuntu.sources >/dev/null 2>&1; then
            # deb822 format: pin the default entries to amd64 only, then
            # drop in a parallel arm64 entry pointing at ports.
            sudo sed -i '/^Types: deb/a Architectures: amd64' \
              /etc/apt/sources.list.d/ubuntu.sources
            . /etc/os-release
            cat <<EOF | sudo tee /etc/apt/sources.list.d/ubuntu-arm64.sources >/dev/null
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: ${UBUNTU_CODENAME} ${UBUNTU_CODENAME}-updates ${UBUNTU_CODENAME}-backports ${UBUNTU_CODENAME}-security
          Components: main restricted universe multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          elif [ -f /etc/apt/sources.list ]; then
            # Legacy one-line format.
            sudo sed -i 's|^deb http|deb [arch=amd64] http|g; s|^deb-src http|deb-src [arch=amd64] http|g' \
              /etc/apt/sources.list
            . /etc/os-release
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${UBUNTU_CODENAME} main restricted universe multiverse" \
              | sudo tee /etc/apt/sources.list.d/ubuntu-arm64.list >/dev/null
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${UBUNTU_CODENAME}-updates main restricted universe multiverse" \
              | sudo tee -a /etc/apt/sources.list.d/ubuntu-arm64.list >/dev/null
          fi
          sudo apt-get update -qq

      - name: Preflight (environment report)
        # Dump everything useful for post-mortem into a single collapsible
        # group. Saves ten minutes of "what was the runner again?" later.
        run: |
          echo "::group::Runner environment"
          echo "# uname"; uname -a
          echo "# distro"; cat /etc/os-release || true
          echo "# cpu";    nproc; head -20 /proc/cpuinfo | grep -E 'model name|cpu cores' | head -2
          echo "# memory"; free -h
          echo "# disk";   df -h /
          echo "# git";    git --version
          echo "# gcc (host)"; gcc --version | head -1
          echo "# gcc (cross)"; aarch64-linux-gnu-gcc --version | head -1
          echo "# make";   make --version | head -1
          echo "# gh";     gh --version | head -1
          echo "# jq";     jq --version
          echo "::endgroup::"
          echo "::group::Repo state"
          git log -1 --format='commit:    %H%nauthor:    %an <%ae>%ndate:      %ad%nsubject:   %s'
          git status --short
          cat versions.lock
          echo "::endgroup::"

      - name: Cache kernel source tarball
        id: kcache
        uses: actions/cache@v4
        with:
          path: work/linux-*.tar.xz
          key: kernel-${{ hashFiles('versions.lock') }}-${{ github.event.inputs.kernel_version || 'latest' }}

      - name: Run pipeline (fetch → health → build)
        env:
          KERNEL_VERSION_INPUT: ${{ github.event.inputs.kernel_version }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          # On tag push (kernel-6.6.x-askN), derive the kernel version from the tag.
          TAG_KVER=""
          if [[ "${GITHUB_REF}" == refs/tags/kernel-* ]]; then
              # tag form: kernel-6.6.123-ask1
              TAG_KVER="${GITHUB_REF_NAME#kernel-}"
              TAG_KVER="${TAG_KVER%-ask*}"
          fi
          KVER="${KERNEL_VERSION_INPUT:-$TAG_KVER}"
          # --skip-fetch is not used — we want the fresh kernel tarball pulled
          # from kernel.org. --no-derive uses committed release/ as the source
          # of truth (matches what a downstream consumer would do).
          if [[ -n "$KVER" ]]; then
              ./scripts/run-pipeline.sh "$KVER" --no-derive --build --ask-extras
          else
              ./scripts/run-pipeline.sh --no-derive --build --ask-extras
          fi

      - name: Collect artefacts
        id: collect
        run: |
          set -euo pipefail
          ls -la work/build/ || true
          # Derive kernel version from a .deb filename for downstream steps.
          KVER=$(ls work/build/linux-image-*.deb 2>/dev/null | head -1 \
                  | sed -E 's|.*linux-image-([0-9]+\.[0-9]+\.[0-9]+).*|\1|')
          echo "kver=$KVER" >> "$GITHUB_OUTPUT"

      - name: Upload build artefacts (workflow)
        uses: actions/upload-artifact@v4
        with:
          name: ask-kernel-${{ steps.collect.outputs.kver }}
          path: |
            work/build/*.deb
            work/build/*.changes
            work/build/*.buildinfo
            work/build/build.log
            release/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/kernel-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag already exists (this workflow was triggered by its push), so
          # publish-binaries.sh would refuse. Use --force to overwrite the
          # auto-created tag entry with our fully-populated release.
          ./scripts/publish-binaries.sh --tag "${GITHUB_REF_NAME}" --force

      - name: Publish GitHub Release (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-binaries.sh