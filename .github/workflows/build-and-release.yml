name: build-and-release

# Triggers:
#   - push to the main branch → build + patch-health, NO release (safety net CI)
#   - workflow_dispatch        → manual build; optional release upload
#   - push tag kernel-*        → build the pinned version and upload as a Release
#
# The job builds natively on a GitHub-hosted arm64 runner (ubuntu-24.04-arm).
# The build scripts are arm64-native only; cross-compilation is not supported.

on:
  push:
    branches: [ "lts-6.6-ls1046a", "main" ]
    tags:     [ "kernel-*" ]
    paths:
      - "release/**"
      - "scripts/**"
      - ".github/workflows/build-and-release.yml"
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Linux 6.6.y version to build (blank → latest)"
        required: false
        default: ""
      publish:
        description: "Upload the resulting .debs to a GitHub Release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # needed for `gh release create` on tag pushes

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ASK kernel (arm64, native)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    # ── Why a container? ──────────────────────────────────────────────
    # The VyOS ISO is Debian bookworm-based. If we build iptables / ppp
    # on the host runner (Ubuntu 24.04 noble-arm), `apt-get source`
    # pulls NOBLE source packages whose Debian control files carry
    #   Depends: libc6 (>= 2.38)
    #   Depends: libpcap0.8t64, libssl3t64   (64-bit time_t transition)
    # These deps are unsatisfiable in a bookworm chroot
    # (libc6 2.36, plain libpcap0.8/libssl3 with no "t64" suffix), so
    # live-build aborts with "held broken packages" (observed in
    # consumer run 24797077372).
    # Running the whole build inside debian:bookworm makes `apt-get
    # source` pick the bookworm source package and produces .debs whose
    # runtime deps match what VyOS's chroot actually provides.
    container:
      image: debian:bookworm
      # No special options required; default /__w mount + root user is
      # fine for dpkg-buildpackage inside the container.

    steps:
      - name: Bootstrap container (git, curl, gh, sudo)
        # The debian:bookworm base image is minimal — actions/checkout
        # needs git+curl, publish-binaries.sh needs gh, and several
        # build scripts `sudo` even though we're already root. Install
        # everything before `actions/checkout@v4` runs.
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            git curl ca-certificates gnupg jq sudo lsb-release \
            apt-transport-https
          # GitHub CLI is not in bookworm main — add the official
          # cli.github.com apt repo so `gh` is available for the
          # publish-binaries.sh step at the end of the job.
          mkdir -p /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update -qq
          apt-get install -y --no-install-recommends gh

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build deps (native arm64, Debian bookworm)
        run: |
          set -eux
          # ── Step 1: enable deb-src so `apt-get source` works ──────────
          # Recent debian:bookworm docker images ship sources in the new
          # deb822 format at /etc/apt/sources.list.d/debian.sources and
          # do NOT populate the legacy /etc/apt/sources.list. Older
          # images had the opposite layout. Handle both so this step is
          # portable across base-image updates.
          if [ -f /etc/apt/sources.list.d/debian.sources ]; then
              # deb822: add deb-src to every stanza's "Types:" line.
              sed -i -E 's/^Types:\s*deb\s*$/Types: deb deb-src/' \
                  /etc/apt/sources.list.d/debian.sources
          fi
          if [ -f /etc/apt/sources.list ]; then
              # one-liner: uncomment existing deb-src, or mirror every
              # "deb " line into a matching "deb-src " line if none exist.
              sed -i 's/^# *deb-src /deb-src /' /etc/apt/sources.list
              if ! grep -q '^deb-src ' /etc/apt/sources.list; then
                  awk '/^deb / { sub(/^deb /,"deb-src "); print }' \
                      /etc/apt/sources.list >> /etc/apt/sources.list
              fi
          fi
          apt-get update -qq
          # Sanity-check that apt actually sees a source index for
          # iptables (cheapest proxy for "bookworm deb-src works").
          # If this fails, `apt-get source iptables` later will too,
          # and fail in a confusing way — abort now with diagnostics.
          if ! apt-cache showsrc iptables 2>/dev/null | grep -q '^Package: iptables'; then
              echo "ERROR: apt-cache has no source index for iptables — deb-src misconfigured"
              echo '----- /etc/apt/sources.list.d/ -----'
              ls -la /etc/apt/sources.list.d/
              echo '----- debian.sources -----'
              cat /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
              echo '----- sources.list -----'
              cat /etc/apt/sources.list 2>/dev/null || true
              exit 1
          fi

          # ── Step 2: native compiler + kernel + extras build-deps ─────
          # Runner IS arm64, so plain `gcc` is the target compiler. Native
          # dev libs satisfy dpkg-checkbuilddeps for iptables/ppp/rp-pppoe.
          apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts quilt dpkg-dev \
            libssl-dev bc flex bison libelf-dev \
            fakeroot kmod rsync cpio patch patchutils \
            libmnl-dev libnftnl-dev libnetfilter-conntrack-dev libnfnetlink-dev \
            libpam0g-dev libpcap0.8-dev libsystemd-dev zlib1g-dev ppp-dev \
            libtraceevent-dev libdw-dev libunwind-dev libaudit-dev \
            libnuma-dev libperl-dev python3-dev libslang2-dev libzstd-dev

      - name: Preflight (environment report)
        # Dump everything useful for post-mortem into a single collapsible
        # group. Saves ten minutes of "what was the runner again?" later.
        run: |
          echo "::group::Runner environment"
          echo "# uname"; uname -a
          echo "# distro"; cat /etc/os-release || true
          echo "# cpu";    nproc; head -20 /proc/cpuinfo | grep -E 'model name|cpu cores' | head -2
          echo "# memory"; free -h
          echo "# disk";   df -h /
          echo "# git";    git --version
          echo "# gcc";    gcc --version | head -1
          echo "# make";   make --version | head -1
          echo "# gh";     gh --version | head -1
          echo "# jq";     jq --version
          echo "::endgroup::"
          echo "::group::Repo state"
          git log -1 --format='commit:    %H%nauthor:    %an <%ae>%ndate:      %ad%nsubject:   %s'
          git status --short
          cat versions.lock
          echo "::endgroup::"

      - name: Cache kernel source tarball
        id: kcache
        uses: actions/cache@v4
        with:
          path: work/linux-*.tar.xz
          key: kernel-${{ hashFiles('versions.lock') }}-${{ github.event.inputs.kernel_version || 'latest' }}

      - name: Run pipeline (fetch → health → build)
        env:
          KERNEL_VERSION_INPUT: ${{ github.event.inputs.kernel_version }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          # On tag push (kernel-6.6.x-askN), derive the kernel version from the tag.
          TAG_KVER=""
          if [[ "${GITHUB_REF}" == refs/tags/kernel-* ]]; then
              # tag form: kernel-6.6.123-ask1
              TAG_KVER="${GITHUB_REF_NAME#kernel-}"
              TAG_KVER="${TAG_KVER%-ask*}"
          fi
          KVER="${KERNEL_VERSION_INPUT:-$TAG_KVER}"
          # --skip-fetch is not used — we want the fresh kernel tarball pulled
          # from kernel.org. --no-derive uses committed release/ as the source
          # of truth (matches what a downstream consumer would do).
          if [[ -n "$KVER" ]]; then
              ./scripts/run-pipeline.sh "$KVER" --no-derive --build --ask-extras
          else
              ./scripts/run-pipeline.sh --no-derive --build --ask-extras
          fi

      - name: Collect artefacts
        id: collect
        run: |
          set -euo pipefail
          ls -la work/build/ || true
          # Derive kernel version from a .deb filename for downstream steps.
          KVER=$(ls work/build/linux-image-*.deb 2>/dev/null | head -1 \
                  | sed -E 's|.*linux-image-([0-9]+\.[0-9]+\.[0-9]+).*|\1|')
          echo "kver=$KVER" >> "$GITHUB_OUTPUT"

      - name: Upload build artefacts (workflow)
        uses: actions/upload-artifact@v4
        with:
          name: ask-kernel-${{ steps.collect.outputs.kver }}
          path: |
            work/build/*.deb
            work/build/*.changes
            work/build/*.buildinfo
            work/build/build.log
            release/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/kernel-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag already exists (this workflow was triggered by its push), so
          # publish-binaries.sh would refuse. Use --force to overwrite the
          # auto-created tag entry with our fully-populated release.
          ./scripts/publish-binaries.sh --tag "${GITHUB_REF_NAME}" --force

      - name: Publish GitHub Release (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-binaries.sh